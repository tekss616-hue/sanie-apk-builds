name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: معرف البناء
        required: true
      app_name:
        description: اسم التطبيق
        required: false
        default: Sanie Game

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Scaffold Capacitor app
        run: |
          set -e
          mkdir -p app/www
          cp "builds/${{ inputs.build_id }}/index.html" app/www/index.html
          cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/android@6 >/dev/null
          npm install -D @capacitor/cli@6 >/dev/null
          npx cap init "${{ inputs.app_name }}" "app.sanie.b${{ inputs.build_id }}" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "${{ inputs.build_id }}.apk"
          gh release create "apk-${{ inputs.build_id }}" "${{ inputs.build_id }}.apk" \
            --title "APK ${{ inputs.build_id }}" \
            --notes "تم البناء بواسطة منصة صانع"
