<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AutoCut Pro | النسخة الاحترافية</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-panel: #18181b;
            --bg-hover: #27272a;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --danger: #ef4444;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --track-video: #3b82f6;
            --track-audio: #10b981;
            --track-text: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Header */
        header { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { font-size: 1.5rem; font-weight: bold; background: linear-gradient(to left, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
        
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-1px); }
        .btn-primary:disabled { background: #3f3f46; color: #71717a; box-shadow: none; cursor: not-allowed; transform: none; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }

        /* Main Layout */
        .workspace { display: flex; flex: 1; height: calc(100vh - 60px - 250px); }
        
        /* Sidebar (Media & Settings) */
        .sidebar { width: 320px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 15px 0; text-align: center; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; transition: 0.2s; font-weight: 600; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(99, 102, 241, 0.05); }
        .tab-content { padding: 20px; overflow-y: auto; flex: 1; display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        select, input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; background: var(--bg-dark); border: 1px solid var(--border); color: white; outline: none; transition: 0.2s; }
        select:focus, input[type="text"]:focus { border-color: var(--accent); }
        
        .upload-zone { border: 2px dashed #3f3f46; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; background: rgba(255,255,255,0.02); }
        .upload-zone:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }
        .upload-zone input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        
        .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; mt-10; }
        .media-item { aspect-ratio: 1; background: #000; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid var(--border); }
        .media-item canvas, .media-item img { width: 100%; height: 100%; object-fit: cover; }
        .media-type-icon { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 4px; font-size: 0.7rem; }

        /* Preview Area */
        .preview-container { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .canvas-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: radial-gradient(circle at center, #18181b 0%, #000 100%); }
        canvas { background: #000; box-shadow: 0 0 40px rgba(0,0,0,0.8); max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Timeline */
        .timeline { height: 250px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        .timeline-toolbar { height: 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 20px; background: #1f1f22; }
        .control-btn { background: none; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; }
        .control-btn:hover { background: rgba(255,255,255,0.1); color: var(--accent); }
        .time-display { font-family: monospace; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
        
        .tracks-container { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; padding: 10px 0; background: #0e0e11; }
        .playhead-wrapper { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
        .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); left: 0%; transform: translateX(-50%); }
        .playhead::before { content: ''; position: absolute; top: 0; left: -5px; width: 12px; height: 12px; background: var(--danger); border-radius: 50%; }
        
        .track { height: 50px; margin-bottom: 10px; position: relative; background: rgba(255,255,255,0.02); border-top: 1px solid #1f1f22; border-bottom: 1px solid #1f1f22; display: flex; }
        .track-header { width: 80px; background: #18181b; border-left: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.7rem; color: var(--text-muted); z-index: 5; position: sticky; left: 0; }
        .track-content { flex: 1; position: relative; }
        
        .clip { position: absolute; height: 80%; top: 10%; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 0.75rem; font-weight: bold; color: #fff; overflow: hidden; white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); transition: 0.1s; }
        .clip.active { box-shadow: inset 0 0 0 2px #fff, 0 0 10px rgba(255,255,255,0.3); z-index: 2; filter: brightness(1.2); }
        
        .clip-video { background: linear-gradient(90deg, #1d4ed8, #3b82f6); }
        .clip-audio { background: linear-gradient(90deg, #047857, #10b981); opacity: 0.7; }
        .clip-text { background: linear-gradient(90deg, #b45309, #f59e0b); }

        /* Loader Overlay */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .spinner { width: 60px; height: 60px; border: 4px solid #27272a; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .overlay h2 { margin-top: 20px; color: white; font-weight: 400; }
        .progress-container { width: 400px; height: 8px; background: #27272a; border-radius: 4px; margin-top: 20px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: 0.2s; }
        
        /* Mobile adjustments */
        @media (max-width: 768px) {
            .workspace { flex-direction: column; height: auto; flex: 1; }
            .sidebar { width: 100%; height: 40vh; border-left: none; border-bottom: 1px solid var(--border); }
            .timeline { height: 30vh; }
            .preview-container { height: 40vh; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🎬 AutoCut Pro</div>
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="btn-generate" onclick="generateTimeline()" disabled>✨ توليد ذكي</button>
        <button class="btn btn-danger" id="btn-export" onclick="startExport()" style="display: none;">💾 تصدير FHD</button>
    </div>
</header>

<div class="workspace">
    <!-- الشريط الجانبي -->
    <div class="sidebar">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('media')">📂 الوسائط</div>
            <div class="tab" onclick="switchTab('settings')">⚙️ الإعدادات</div>
        </div>
        
        <!-- تبويب الوسائط -->
        <div id="tab-media" class="tab-content active">
            <div class="upload-zone">
                <span style="font-size: 2rem;">📥</span><br>
                <span>اضغط لرفع فيديو أو صور</span>
                <input type="file" id="upload-video" multiple accept="video/mp4,video/webm,image/jpeg,image/png">
            </div>
            <div class="upload-zone" style="padding: 15px;">
                <span style="font-size: 1.5rem;">🎵</span> <span>رفع موسيقى (اختياري)</span>
                <input type="file" id="upload-audio" accept="audio/mp3,audio/wav">
            </div>
            <div class="media-grid" id="media-gallery"></div>
        </div>
        
        <!-- تبويب الإعدادات -->
        <div id="tab-settings" class="tab-content">
            <div class="form-group">
                <label>أبعاد الفيديو</label>
                <select id="setting-ratio">
                    <option value="9:16">📱 تيك توك / ريلز (9:16)</option>
                    <option value="16:9">🖥️ يوتيوب / سينمائي (16:9)</option>
                    <option value="1:1">⬛ انستجرام (1:1)</option>
                </select>
            </div>
            <div class="form-group">
                <label>نمط المونتاج (AI Style)</label>
                <select id="setting-style">
                    <option value="hype">🔥 Hype / حماسي (تزامن إيقاعي + زووم)</option>
                    <option value="cinematic">🎬 Cinematic / سينمائي (بطيء + ألوان عميقة)</option>
                    <option value="glitch">👾 Cyber Glitch / رعب (تشويش + RGB Split)</option>
                    <option value="vlog">👋 Vlog / فلوق هادئ (انتقالات ناعمة)</option>
                </select>
            </div>
            <div class="form-group">
                <label>النصوص التلقائية (Auto-Captions)</label>
                <select id="setting-text">
                    <option value="on">✅ تفعيل (كلمات حماسية)</option>
                    <option value="off">❌ إيقاف</option>
                </select>
            </div>
            <div class="form-group">
                <label>تأثيرات بصرية إضافية</label>
                <label style="display: flex; gap: 10px; align-items: center; cursor: pointer; color: white; font-weight: normal;">
                    <input type="checkbox" id="setting-grain" checked> 🎞️ حبيبات سينمائية (Film Grain)
                </label>
            </div>
        </div>
    </div>

    <!-- شاشة العرض -->
    <div class="preview-container">
        <div class="canvas-wrapper">
            <canvas id="player-canvas"></canvas>
        </div>
    </div>
</div>

<!-- التايم لاين -->
<div class="timeline">
    <div class="timeline-toolbar">
        <button class="control-btn" id="btn-play" onclick="togglePlay()">▶</button>
        <div class="time-display" id="time-display">00:00.00 / 00:00.00</div>
    </div>
    <div class="tracks-container" id="timeline-scroll">
        <div class="playhead-wrapper"><div class="playhead" id="playhead"></div></div>
        
        <div class="track">
            <div class="track-header">📹 فيديو</div>
            <div class="track-content" id="track-video"></div>
        </div>
        <div class="track">
            <div class="track-header">🔤 نصوص</div>
            <div class="track-content" id="track-text"></div>
        </div>
        <div class="track">
            <div class="track-header">🎵 صوت</div>
            <div class="track-content" id="track-audio"></div>
        </div>
    </div>
</div>

<!-- شاشة التحميل والتصدير -->
<div class="overlay" id="loading-overlay">
    <div class="spinner"></div>
    <h2 id="loading-text">جاري المعالجة...</h2>
    <div class="progress-container"><div class="progress-bar" id="loading-progress"></div></div>
</div>

<script>
    // --- قواعد البيانات والحالة ---
    const mediaPool = [];
    let audioTrack = null;
    let project = { clips: [], texts: [], duration: 0, fps: 30 };
    
    // حالة المشغل
    let isPlaying = false;
    let currentTime = 0;
    let animationId = null;
    let lastTime = 0;
    
    // الكانفاس والمؤثرات
    const canvas = document.getElementById('player-canvas');
    const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    const offscreenCanvas = document.createElement('canvas'); // للضوضاء (Grain)
    const offCtx = offscreenCanvas.getContext('2d');
    
    // إعدادات التصدير
    let mediaRecorder;
    let recordedChunks = [];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let destNode;

    // --- واجهة المستخدم ---
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    // --- إدارة الملفات ---
    document.getElementById('upload-video').addEventListener('change', async (e) => {
        const files = e.target.files;
        for (let file of files) {
            const url = URL.createObjectURL(file);
            const isVideo = file.type.startsWith('video');
            const el = document.createElement(isVideo ? 'video' : 'img');
            el.src = url;
            if(isVideo) {
                el.muted = true; el.playsInline = true; el.crossOrigin = "anonymous";
                await new Promise(r => el.onloadedmetadata = r);
            } else {
                await new Promise(r => el.onload = r);
            }
            
            const mediaObj = { id: Date.now()+Math.random(), type: isVideo ? 'video' : 'image', el: el, duration: isVideo ? el.duration : 4 };
            mediaPool.push(mediaObj);
            
            // رسم صورة مصغرة
            const thumbCanvas = document.createElement('canvas');
            thumbCanvas.width = 100; thumbCanvas.height = 100;
            const tCtx = thumbCanvas.getContext('2d');
            if(isVideo) el.currentTime = 1; // أخذ فريم بعد ثانية
            setTimeout(() => {
                let s = Math.max(100/el.videoWidth||el.width, 100/el.videoHeight||el.height);
                tCtx.drawImage(el, 0,0, (el.videoWidth||el.width)*s, (el.videoHeight||el.height)*s);
                
                const item = document.createElement('div');
                item.className = 'media-item';
                item.appendChild(thumbCanvas);
                item.innerHTML += `<div class="media-type-icon">${isVideo ? '🎥' : '🖼️'}</div>`;
                document.getElementById('media-gallery').appendChild(item);
                checkReady();
            }, isVideo ? 200 : 0);
        }
    });

    document.getElementById('upload-audio').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            const el = document.createElement('audio');
            el.src = url; el.crossOrigin = "anonymous";
            audioTrack = { el: el, name: file.name };
            checkReady();
        }
    });

    function checkReady() {
        if (mediaPool.length > 0) document.getElementById('btn-generate').disabled = false;
    }

    // --- الذكاء الاصطناعي لتوليد المونتاج (AI Logic) ---
    async function generateTimeline() {
        if(mediaPool.length === 0) return;
        showLoading("جاري تحليل الإيقاع وصنع السيناريو...", 20);
        await new Promise(r => setTimeout(r, 500)); // محاكاة تحليل
        
        const ratio = document.getElementById('setting-ratio').value;
        const style = document.getElementById('setting-style').value;
        const autoText = document.getElementById('setting-text').value === 'on';
        
        // ضبط أبعاد المشروع
        if(ratio === '16:9') { canvas.width = 1920; canvas.height = 1080; }
        else if(ratio === '9:16') { canvas.width = 1080; canvas.height = 1920; }
        else { canvas.width = 1080; canvas.height = 1080; }
        
        offscreenCanvas.width = canvas.width; offscreenCanvas.height = canvas.height;
        generateGrain();

        project.clips = [];
        project.texts = [];
        
        // محاكاة إيقاع الموسيقى (BPM)
        let bpm = 120; 
        if(style === 'hype') bpm = 140;
        if(style === 'cinematic') bpm = 80;
        let beatDuration = 60 / bpm; // مدة الدقة بالثواني
        
        let targetDuration = 15; // المونتاج 15 ثانية كافتراضي
        if(audioTrack) {
            await new Promise(r => {
                if(audioTrack.el.readyState >= 1) r();
                else audioTrack.el.onloadedmetadata = r;
            });
            targetDuration = Math.min(audioTrack.el.duration, 30); // أقصى حد 30 ثانية للتجربة
        }
        project.duration = targetDuration;

        let currTime = 0;
        const hypeWords = ["HYPE!", "EPIC", "WOW", "LET'S GO", "FIRE🔥", "BOOM!"];
        const cinematicWords = ["Silence...", "Breathe", "Memories", "Journey", "Focus"];
        
        showLoading("قص وتنسيق المقاطع...", 60);

        while(currTime < targetDuration) {
            let media = mediaPool[Math.floor(Math.random() * mediaPool.length)];
            
            // تحديد طول المقطع بناءً على الإيقاع والستايل
            let beats = 1;
            if(style === 'hype') beats = Math.random() > 0.5 ? 1 : 0.5; // قص سريع جداً
            else if(style === 'cinematic') beats = Math.floor(Math.random() * 3) + 2; // قص بطيء
            else if(style === 'glitch') beats = Math.random() > 0.7 ? 0.25 : 1; // ومضات سريعة
            else beats = 2; // Vlog
            
            let clipDur = beats * beatDuration;
            if (currTime + clipDur > targetDuration) clipDur = targetDuration - currTime;
            
            let startSource = 0;
            if(media.type === 'video' && media.duration > clipDur) {
                startSource = Math.random() * (media.duration - clipDur);
            }

            // فلاتر وحركات
            let filter = 'none', scaleStart = 1, scaleEnd = 1, effect = 'none';
            if(style === 'hype') { filter = 'contrast(1.2) saturate(1.5)'; scaleStart = 1; scaleEnd = 1.1; if(Math.random()>0.8) effect = 'shake'; }
            if(style === 'cinematic') { filter = 'contrast(1.1) saturate(0.8) sepia(0.2)'; scaleStart = 1.1; scaleEnd = 1; effect = 'letterbox'; }
            if(style === 'glitch') { filter = 'contrast(1.5) brightness(0.8)'; effect = Math.random()>0.5 ? 'glitch' : 'rgb_split'; }
            
            project.clips.push({
                media: media, start: currTime, end: currTime + clipDur, dur: clipDur,
                sourceStart: startSource, filter: filter, scaleStart: scaleStart, scaleEnd: scaleEnd, effect: effect
            });

            // إضافة نصوص تلقائية
            if(autoText && Math.random() > 0.4) {
                let words = style === 'hype' ? hypeWords : cinematicWords;
                let word = words[Math.floor(Math.random() * words.length)];
                project.texts.push({
                    text: word, start: currTime, end: currTime + (clipDur*0.8),
                    x: canvas.width/2, y: canvas.height/2, size: style==='hype'?150:80,
                    color: style==='hype' ? '#ffffff' : '#e2e8f0', shadow: style==='hype' ? '#ef4444' : '#000000',
                    anim: style==='hype' ? 'pop' : 'fade'
                });
            }

            currTime += clipDur;
        }

        renderTimelineUI();
        hideLoading();
        document.getElementById('btn-export').style.display = 'block';
        
        currentTime = 0;
        if(!isPlaying) togglePlay();
    }

    // --- محرك الرندر (Canvas Graphics) ---
    function generateGrain() {
        offCtx.fillStyle = '#808080'; offCtx.fillRect(0,0, offscreenCanvas.width, offscreenCanvas.height);
        const imgData = offCtx.getImageData(0,0, offscreenCanvas.width, offscreenCanvas.height);
        const data = imgData.data;
        for(let i=0; i<data.length; i+=4) {
            let noise = (Math.random() - 0.5) * 50;
            data[i] += noise; data[i+1] += noise; data[i+2] += noise;
        }
        offCtx.putImageData(imgData, 0, 0);
    }

    function renderFrame(time) {
        if(!isPlaying) { lastTime = time; return; }
        let delta = (time - lastTime) / 1000;
        lastTime = time;
        currentTime += delta;
        
        if(currentTime >= project.duration) {
            currentTime = 0; togglePlay(); updateUI(); return;
        }

        drawState();
        updateUI();
        animationId = requestAnimationFrame(renderFrame);
    }

    function drawState() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0, canvas.width, canvas.height);
        
        let clipIdx = project.clips.findIndex(c => currentTime >= c.start && currentTime < c.end);
        if(clipIdx === -1) return;
        
        let clip = project.clips[clipIdx];
        let progress = (currentTime - clip.start) / clip.dur;
        
        // تحديث الفيديو
        if(clip.media.type === 'video') {
            let tTime = clip.sourceStart + (currentTime - clip.start);
            if(Math.abs(clip.media.el.currentTime - tTime) > 0.1) clip.media.el.currentTime = tTime;
        }

        ctx.save();
        
        // الفلاتر والحركة (Ken Burns)
        ctx.filter = clip.filter;
        let currentScale = clip.scaleStart + (clip.scaleEnd - clip.scaleStart) * progress;
        
        // تأثيرات الحركة (Shake)
        if(clip.effect === 'shake') { ctx.translate((Math.random()-0.5)*20, (Math.random()-0.5)*20); }
        
        // رسم الميديا
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.scale(currentScale, currentScale);
        ctx.translate(-canvas.width/2, -canvas.height/2);
        
        if (clip.effect === 'rgb_split') {
            // تأثير RGB Glitch
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = 'red';
            drawMediaCover(clip.media.el, canvas.width, canvas.height, -10, 0);
            ctx.fillStyle = 'cyan';
            drawMediaCover(clip.media.el, canvas.width, canvas.height, 10, 0);
            ctx.globalCompositeOperation = 'source-over';
        } else if (clip.effect === 'glitch' && Math.random() > 0.8) {
            // تأثير Slice Glitch
            drawMediaCover(clip.media.el, canvas.width, canvas.height, 0, 0);
            let sliceY = Math.random() * canvas.height;
            ctx.drawImage(canvas, 0, sliceY, canvas.width, 100, (Math.random()-0.5)*50, sliceY, canvas.width, 100);
        } else {
            // عادي
            drawMediaCover(clip.media.el, canvas.width, canvas.height, 0, 0);
        }
        ctx.restore();

        // تأثير الحبيبات السينمائية
        if(document.getElementById('setting-grain').checked) {
            ctx.save();
            ctx.globalCompositeOperation = 'overlay';
            ctx.globalAlpha = 0.15;
            ctx.drawImage(offscreenCanvas, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
            ctx.restore();
        }

        // تأثير الشريط السينمائي (Letterbox)
        if(clip.effect === 'letterbox') {
            ctx.fillStyle = '#000';
            let barHeight = canvas.height * 0.12;
            ctx.fillRect(0,0, canvas.width, barHeight);
            ctx.fillRect(0, canvas.height-barHeight, canvas.width, barHeight);
        }

        // رسم النصوص (Auto-Captions)
        let activeTexts = project.texts.filter(t => currentTime >= t.start && currentTime < t.end);
        activeTexts.forEach(t => {
            let tProg = (currentTime - t.start) / (t.end - t.start);
            ctx.save();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `900 ${t.size}px 'Segoe UI', Impact, sans-serif`;
            
            let scale = 1, alpha = 1;
            if(t.anim === 'pop') {
                scale = tProg < 0.1 ? (tProg/0.1)*1.2 : (tProg<0.2 ? 1.2 - ((tProg-0.1)/0.1)*0.2 : 1);
            } else if (t.anim === 'fade') {
                alpha = tProg < 0.2 ? tProg/0.2 : (tProg > 0.8 ? 1 - (tProg-0.8)/0.2 : 1);
                ctx.globalAlpha = alpha;
            }
            
            ctx.translate(t.x, t.y);
            ctx.scale(scale, scale);
            
            // stroke & fill
            ctx.lineWidth = t.size * 0.1;
            ctx.strokeStyle = t.shadow;
            ctx.strokeText(t.text, 0, 0);
            ctx.fillStyle = t.color;
            ctx.fillText(t.text, 0, 0);
            ctx.restore();
        });
    }

    function drawMediaCover(el, w, h, offsetX=0, offsetY=0) {
        let mw = el.videoWidth || el.width;
        let mh = el.videoHeight || el.height;
        if(!mw || !mh) return;
        let scale = Math.max(w / mw, h / mh);
        let x = (w / 2) - (mw / 2) * scale + offsetX;
        let y = (h / 2) - (mh / 2) * scale + offsetY;
        ctx.drawImage(el, x, y, mw * scale, mh * scale);
    }

    // --- التايم لاين والواجهة ---
    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('btn-play').innerHTML = isPlaying ? '⏸' : '▶';
        if(isPlaying) {
            lastTime = performance.now();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if(audioTrack && audioTrack.el) { audioTrack.el.currentTime = currentTime; audioTrack.el.play(); }
            project.clips.forEach(c => { if(c.media.type==='video') c.media.el.play(); });
            animationId = requestAnimationFrame(renderFrame);
        } else {
            cancelAnimationFrame(animationId);
            if(audioTrack && audioTrack.el) audioTrack.el.pause();
            project.clips.forEach(c => { if(c.media.type==='video') c.media.el.pause(); });
        }
    }

    function formatTime(sec) {
        let m = Math.floor(sec / 60).toString().padStart(2, '0');
        let s = Math.floor(sec % 60).toString().padStart(2, '0');
        let ms = Math.floor((sec % 1) * 100).toString().padStart(2, '0');
        return `${m}:${s}.${ms}`;
    }

    function updateUI() {
        document.getElementById('time-display').innerText = `${formatTime(currentTime)} / ${formatTime(project.duration)}`;
        let p = (currentTime / project.duration) * 100;
        document.getElementById('playhead').style.left = `${p}%`;
        
        document.querySelectorAll('.clip').forEach(el => {
            let start = parseFloat(el.dataset.start), end = parseFloat(el.dataset.end);
            if(currentTime >= start && currentTime < end) el.classList.add('active');
            else el.classList.remove('active');
        });
    }

    function renderTimelineUI() {
        const vTrack = document.getElementById('track-video'); vTrack.innerHTML = '';
        const tTrack = document.getElementById('track-text'); tTrack.innerHTML = '';
        const aTrack = document.getElementById('track-audio'); aTrack.innerHTML = '';
        
        project.clips.forEach((c, i) => {
            let el = document.createElement('div');
            el.className = 'clip clip-video';
            el.style.left = `${(c.start/project.duration)*100}%`;
            el.style.width = `${(c.dur/project.duration)*100}%`;
            el.dataset.start = c.start; el.dataset.end = c.end;
            el.innerText = `V${i+1} [${c.effect}]`;
            vTrack.appendChild(el);
        });

        project.texts.forEach((t) => {
            let el = document.createElement('div');
            el.className = 'clip clip-text';
            el.style.left = `${(t.start/project.duration)*100}%`;
            el.style.width = `${((t.end-t.start)/project.duration)*100}%`;
            el.dataset.start = t.start; el.dataset.end = t.end;
            el.innerText = `"${t.text}"`;
            tTrack.appendChild(el);
        });

        if(audioTrack) {
            let el = document.createElement('div');
            el.className = 'clip clip-audio';
            el.style.left = `0%`; el.style.width = `100%`;
            el.innerText = `🎵 ${audioTrack.name}`;
            aTrack.appendChild(el);
        }
        updateUI();
    }

    // --- محرك التصدير (Real-time Render) ---
    async function startExport() {
        if(isPlaying) togglePlay();
        showLoading("جاري تصدير الفيديو بأعلى جودة...", 0);
        
        currentTime = 0; recordedChunks = [];
        
        // إعداد ستريم الكانفاس والصوت
        const canvasStream = canvas.captureStream(project.fps);
        let finalStream = canvasStream;
        
        if (audioTrack && audioTrack.el) {
            if(!destNode) destNode = audioCtx.createMediaStreamDestination();
            
            // إنشاء عقدة جديدة كل مرة لتجنب الأخطاء
            let source = audioCtx.createMediaElementSource(audioTrack.el);
            source.connect(destNode);
            // لا نوصله بالـ destination الأساسي حتى لا يزعج المستخدم أثناء الرندر الوهمي
            
            const tracks = [...canvasStream.getVideoTracks(), ...destNode.stream.getAudioTracks()];
            finalStream = new MediaStream(tracks);
            
            audioTrack.el.currentTime = 0;
            audioTrack.el.play();
        }

        // استخدام codec حديث إن أمكن
        let options = { mimeType: 'video/webm; codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
        
        mediaRecorder = new MediaRecorder(finalStream, options);
        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: options.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `AutoCut_Pro_${Date.now()}.webm`; a.click();
            hideLoading();
            alert('✅ تم التصدير بنجاح! يمكنك تحويل ملف WebM إلى MP4 عبر أي موقع مجاني إذا احتجت ذلك للآيفون.');
        };

        mediaRecorder.start();
        
        // رندر وهمي سريع متزامن مع معدل الإطارات
        let frameTime = 1 / project.fps;
        let exportTimer = setInterval(() => {
            currentTime += frameTime;
            if(currentTime >= project.duration) {
                clearInterval(exportTimer);
                mediaRecorder.stop();
                if(audioTrack) audioTrack.el.pause();
                currentTime = 0; drawState(); updateUI();
            } else {
                drawState();
                let p = Math.floor((currentTime / project.duration) * 100);
                document.getElementById('loading-progress').style.width = `${p}%`;
                document.getElementById('loading-text').innerText = `جاري الرندرة... ${p}%`;
            }
        }, 1000 / project.fps);
    }

    // --- أدوات ---
    function showLoading(txt, prog) {
        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('loading-text').innerText = txt;
        document.getElementById('loading-progress').style.width = `${prog}%`;
    }
    function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }
    
    // إعداد أولي
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0, canvas.width, canvas.height);
</script>
</body>
